name: Build Android (personal)

# Builds the mobile app (mobile/) as an installable APK and uploads it as an artifact.
# Signing: add the repository secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD. Without them the APK is signed with a throwaway debug
# key and every new build has to be installed after uninstalling the previous one.
on:
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "src/utils/sync/**"
      - "src/utils/pgnTree.ts"
      - "src/utils/noteLine.ts"
      - "src/utils/treeReducer.ts"
      - "src/utils/chessops.ts"
      - "src/components/files/opening.ts"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Publishing the APK as a GitHub release.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # Needed only to type-check the desktop modules shared with the mobile app.
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check and build web app
        working-directory: mobile
        run: |
          npm run typecheck
          npm run build
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: the APK is signed with a debug key"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/en-croissant-mobile-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Each build is published as a release "android-v0.1.<build>" marked as latest, so
      # https://github.com/<repo>/releases/latest/download/EnCroissant-Repertorio.apk
      # always downloads the newest APK (and Obtainium can follow the releases).
      # Only the last 3 Android releases are kept.
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-v0.1.${{ github.run_number }}
        run: |
          cp "$RUNNER_TEMP"/apk/*.apk "$RUNNER_TEMP/EnCroissant-Repertorio.apk"
          gh release create "$TAG" "$RUNNER_TEMP/EnCroissant-Repertorio.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Android 0.1.${{ github.run_number }}" \
            --notes "App Android, build ${{ github.run_number }} ($GITHUB_SHA)."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("android-v"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
