name: Build Windows (personal)

# Builds the Windows NSIS installer of this fork and uploads it as a
# downloadable artifact. Runs on every push to master and on demand.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # Publishing the installer as a GitHub release.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIX_EXTENSION_TARGET: windows_amd64
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"
          CI: false
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # The installer is published in the release "windows" (replaced at every build), so
      # https://github.com/<repo>/releases/download/windows/EnCroissant-Setup.exe
      # always downloads the newest one. Not marked as latest: that link is Android's.
      - name: Publish release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe "$RUNNER_TEMP/EnCroissant-Setup.exe"
          gh release delete windows --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create windows "$RUNNER_TEMP/EnCroissant-Setup.exe" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Windows (ultima build)" \
            --notes "Installer Windows, build ${{ github.run_number }} ($GITHUB_SHA)."
